<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>englishnayakids.ru</title>
  <meta name="description" content="Игровой английский дома для детей 3–6 лет. Готовые идеи для мам малышей." />

  <!-- Google Fonts: Unbounded -->
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&subset=latin,cyrillic" rel="stylesheet">

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <style>
    /* Цвета из Tilda */
    :root {
      --tilda-pink: #f2a4cf;
      --tilda-beige: #f2f0c2;
      --tilda-light-beige: #f7f6ea;
      --tilda-dark: #2c3e50;
      --brand-yellow: #f4e39e;
      --white: #ffffff;
      --text: #333;
    }

    body {
      font-family: 'Unbounded', sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background: var(--tilda-beige);
      color: var(--text);
      overflow-x: hidden;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Шапка — сильно уменьшена (в 2 раза) */
    header {
      background: var(--white);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      transition: transform 0.3s ease;
      padding: 4px 0;
    }

    .header-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.3em;
      color: var(--tilda-pink);
      margin: 4px 0;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
    }

    h1 small {
      font-size: 0.6em;
      color: var(--tilda-dark);
      display: block;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 6px 0;
      background: var(--brand-yellow);
      font-weight: 500;
      font-size: 13px;
      border-radius: 6px;
      margin: 0 10px;
      flex-wrap: wrap;
      row-gap: 6px;
    }


    nav a {
      color: var(--tilda-pink);
      text-decoration: none;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 0;
      height: 1.5px;
      background: var(--tilda-pink);
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    /* Контент с отступом от шапки */
    .content {
      margin-top: 90px;
    }

    /* Кнопки */
    .btn {
      display: inline-block;
      background: var(--white);
      color: var(--tilda-pink);
      padding: 9px 22px;
      margin: 8px 5px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9em;
      border: 2px solid var(--tilda-pink);
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .btn:hover {
      background: var(--tilda-pink);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Заголовки */
    h2 {
      text-align: center;
      color: var(--tilda-pink);
      font-size: 1.6em;
      margin: 35px 0 20px;
      border-bottom: 3px solid var(--tilda-pink);
      display: inline-block;
      padding-bottom: 6px;
    }

    /* Блоки преимуществ */
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin: 20px 0;
      justify-content: center;
    }

    .feature {
      flex: 1 1 270px;
      max-width: 300px;
      background: var(--white);
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border: 1px solid var(--tilda-pink);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .feature:hover {
      transform: translateY(-4px);
    }

    .feature h3 {
      color: var(--tilda-pink);
      margin-top: 0;
      font-size: 1.15em;
    }

    /* Секция с изображением */
    .detective-section {
      text-align: center;
      margin: 35px 0;
      padding: 20px;
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .detective-section img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 12px 0;
      box-shadow: none;
      background: none;
      max-width: min(100%, 420px);
    }

    /* Тарифы */
    .pricing-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin: 20px 0;
      justify-content: center;
    }

    .pricing-card {
      flex: 1 1 270px;
      max-width: 320px;
      background: var(--tilda-light-beige);
      border: 1px solid var(--tilda-pink);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      transition: transform 0.3s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .pricing-card:hover {
      transform: scale(1.02);
    }

    .pricing-card h3 {
      color: var(--tilda-pink);
      font-size: 1.35em;
      margin-top: 0;
    }

    .pricing-card .price {
      font-size: 1.7em;
      font-weight: 700;
      color: var(--tilda-dark);
    }

    .pricing-card ul {
      list-style: none;
      padding: 0;
      text-align: left;
      margin: 16px 0;
      font-size: 0.9em;
    }

    .pricing-card li {
      margin: 7px 0;
      padding-left: 25px;
      position: relative;
    }

    .pricing-card li::before {
      content: "✔";
      color: #27ae60;
      font-weight: bold;
      position: absolute;
      left: 0;
    }

    .pricing-card .no-access::before {
      content: "✖";
      color: #e74c3c;
    }

    .pricing-card .no-access {
      color: #e74c3c;
    }

    /* FAQ */
    .faq-item {
      margin: 18px 0;
      padding: 16px;
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border: 1px solid var(--tilda-pink);
    }

    .faq-header {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      font-size: 1.1em;
      color: var(--tilda-pink);
      font-weight: 600;
    }

    .faq-header::after {
      content: '+';
    }

    .faq-header.active::after {
      content: '−';
    }

    .faq-body {
      display: none;
      margin-top: 10px;
      line-height: 1.5;
      color: #555;
      font-size: 0.9em;
    }

    /* Соцсети */
    .socials a {
      margin: 0 9px;
      color: var(--tilda-dark);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9em;
    }

    .socials a:hover {
      color: var(--tilda-pink);
    }

    /* Подвал */
    footer {
      text-align: center;
      padding: 25px 20px;
      margin-top: 45px;
      color: #666;
      font-size: 0.85em;
      border-top: 1px dashed var(--tilda-pink);
    }

    footer p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .offer-link {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 16px;
      background: var(--tilda-pink);
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.3s;
    }

    .offer-link:hover {
      background: #d18ab8;
    }

    /* Мобильная адаптация — улучшена */
    @media (max-width: 600px) {
      .content {
        margin-top: 80px;
        padding: 12px;
      }
      h1 {
        font-size: 1.2em;
      }
      nav {
        gap: 9px;
        padding: 5px 0;
        font-size: 12px;
        margin: 0 8px;
      }
      h2 {
        font-size: 1.4em;
      }
      .btn {
        padding: 8px 20px;
        font-size: 0.85em;
      }
      .pricing-card {
        max-width: 100%;
        padding: 16px;
      }
      .feature {
        max-width: 100%;
        padding: 14px;
      }
      .faq-header {
        font-size: 1.05em;
      }
      .offer-link {
        font-size: 0.85em;
        padding: 6px 14px;
      }
      footer {
        font-size: 0.8em;
      }
      .detective-section {
        margin: 30px 0;
        padding: 16px;
      }
    }
  </style>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

  <!-- Шапка -->
  <header id="header">
    <div class="container header-inner">
      <nav>
        <a href="/" class="active">Главная</a>
        <a href="/games/">Игры</a>
        <a href="/shop/">Магазин</a>
        <a href="/advent">Адвент-календарь</a>
      </nav>
    </div>
  </header>

  <div class="container content">

    <!-- Главный баннер -->
    <section class="hero animate__animated animate__fadeIn">
      <p>Игровой английский дома для детей 3–6 лет 🧩 Готовые идеи для мам малышей 👶🏼</p>
      <a href="https://vk.ru/englishnaya.kids" class="btn">Хочу на занятия!</a>
    </section>

    <!-- Изображение детектива -->
    <section class="detective-section animate__animated animate__fadeInUp">
      <img src="/img/hero-logo.png" alt="Инглишная KiDS">
    </section>

    <!-- Преимущества -->

    <!-- Расписание -->

    <!-- Стоимость -->

    <!-- FAQ -->

    <!-- Контакты -->
    <section id="contact">
      <h2>Наши соцсети</h2>
      <div class="socials">
        <a href="https://vk.ru/englishnaya.kids" target="_blank">ВКонтакте</a>
      </div>
    </section>

    <footer>
      <p>© 2026 englishnayakids.ru<br>
      Самозанятый — Дроздова Екатерина Сергеевна<br>
      ИНН: 027720443731<br>
      <a href="mailto:englishnayaa@mail.ru">englishnayaa@mail.ru</a></p>

    </footer>

  </div>

  <!-- Скрипт: скрытие меню при прокрутке вниз и FAQ -->
  <script>
    let lastScrollTop = 0;
    const header = document.getElementById("header");

    window.addEventListener("scroll", function() {
      const currentScroll = window.pageYOffset || document.documentElement.scrollTop;

      if (currentScroll > lastScrollTop && currentScroll > 50) {
        header.style.transform = "translateY(-100%)";
      } else {
        header.style.transform = "translateY(0)";
      }

      lastScrollTop = currentScroll;
    });

    // Аккордеон для FAQ
    document.querySelectorAll('.faq-header').forEach(header => {
      header.addEventListener('click', () => {
        const body = header.nextElementSibling;
        const isActive = header.classList.contains('active');

        document.querySelectorAll('.faq-header').forEach(h => {
          h.classList.remove('active');
          h.nextElementSibling.style.display = 'none';
        });

        if (!isActive) {
          header.classList.add('active');
          body.style.display = 'block';
        }
      });
    });
  </script>

</body>
</html>
