<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Игры — englishnayakids.ru</title>
  <meta name="description" content="Обучающие игры по английскому языку от клуба «Инглишная KiDS»." />

  <!-- Google Fonts: Unbounded (как на главной) -->
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&subset=latin,cyrillic" rel="stylesheet">

  <style>
    :root {
      --tilda-pink: #f2a4cf;
      --tilda-beige: #f2f0c2;
      --tilda-light-beige: #f7f6ea;
      --tilda-dark: #2c3e50;
      --white: #ffffff;
      --text: #333;
    }

    body {
      font-family: 'Unbounded', sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background: var(--tilda-beige);
      color: var(--text);
      overflow-x: hidden;
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

    /* Шапка — как на главной */
    header {
      background: var(--white);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      transition: transform 0.3s ease;
      padding: 4px 0;
    }
    .header-inner { display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 1.3em; color: var(--tilda-pink); margin: 4px 0; font-weight: 600; text-align: center; line-height: 1.2; }
    h1 small { font-size: 0.6em; color: var(--tilda-dark); display: block; }
    h1 a { color: inherit; text-decoration: none; }
    nav {
      display: flex; justify-content: center; gap: 25px; padding: 6px 0;
      background: var(--tilda-dark); font-weight: 500; font-size: 13px; border-radius: 6px; margin: 0 10px;
    }
    nav a { color: white; text-decoration: none; position: relative; }
    nav a::after {
      content: ''; position: absolute; bottom: -3px; left: 0; width: 0; height: 1.5px;
      background: var(--tilda-pink); transition: width 0.3s ease;
    }
    nav a:hover::after, nav a.active::after { width: 100%; }

    .content { margin-top: 90px; }

    h2 {
      text-align: center; color: var(--tilda-pink); font-size: 1.6em; margin: 35px 0 8px;
      border-bottom: 3px solid var(--tilda-pink); display: inline-block; padding-bottom: 6px;
    }
    .title-wrap { text-align: center; }
    .lead { text-align: center; margin: 0 auto 24px; max-width: 640px; font-size: 0.95em; }

    /* Сетка 3×3 */
    .games-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: 10px 0 30px;
    }
    .game {
      display: flex; flex-direction: column; background: var(--white); border-radius: 10px;
      border: 1px solid var(--tilda-pink); box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      text-decoration: none; color: inherit; overflow: hidden; transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    a.game:hover, a.game:focus-visible { transform: translateY(-4px); box-shadow: 0 8px 18px rgba(0,0,0,0.14); }
    a.game:focus-visible { outline: 3px solid var(--tilda-dark); outline-offset: 2px; }
    .game-img { aspect-ratio: 4 / 3; background: var(--tilda-light-beige); overflow: hidden; }
    .game-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .game-body { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .game-body h3 { margin: 0; font-size: 0.95em; color: var(--tilda-dark); line-height: 1.3; }
    .game-body p { margin: 0; font-size: 0.78em; line-height: 1.5; flex: 1; }
    .age {
      align-self: flex-start; font-size: 0.7em; font-weight: 600; color: var(--tilda-dark);
      background: var(--tilda-beige); padding: 2px 10px; border-radius: 12px;
    }
    .play {
      align-self: flex-start; margin-top: 4px; display: inline-block; background: var(--white); color: var(--tilda-pink);
      padding: 7px 18px; border-radius: 25px; font-weight: 600; font-size: 0.8em; border: 2px solid var(--tilda-pink);
      transition: all 0.3s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    a.game:hover .play { background: var(--tilda-pink); color: white; }

    /* Пустые места под будущие игры */
    .game.soon {
      background: rgba(255,255,255,0.45); border: 2px dashed var(--tilda-pink); box-shadow: none;
      align-items: center; justify-content: center; text-align: center; min-height: 220px; padding: 16px;
    }
    .game.soon .num { font-size: 2.2em; font-weight: 700; color: var(--tilda-pink); line-height: 1; }
    .game.soon .txt { font-size: 0.85em; color: var(--tilda-dark); font-weight: 500; margin-top: 6px; }

    footer { text-align: center; font-size: 0.85em; margin: 30px 0 10px; }
    footer p { margin: 4px 0; }
    footer a { color: var(--tilda-dark); }

    @media (max-width: 800px) { .games-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) {
      .content { margin-top: 80px; padding: 12px; }
      h1 { font-size: 1.2em; }
      nav { gap: 12px; padding: 5px 0; font-size: 12px; margin: 0 8px; }
      h2 { font-size: 1.4em; }
    }
    @media (max-width: 420px) { .games-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header id="header">
    <div class="container header-inner">
      <nav>
        <a href="/games/" class="active">Игры</a>
        <a href="/shop/">Магазин</a>
      </nav>
    </div>
  </header>

  <div class="container content">
    <div class="title-wrap"><h2>Игры</h2></div>
    <p class="lead">Играем и учим английский вместе с клубом «Инглишная KiDS».</p>

    <div class="games-grid" id="grid" aria-label="Список игр"></div>

    <footer>
      <p>© 2026 englishnayakids.ru<br>
      Самозанятый — Дроздова Екатерина Сергеевна<br>
      ИНН: 027720443731<br>
      <a href="mailto:englishnayaa@mail.ru">englishnayaa@mail.ru</a></p>
    </footer>
  </div>

  <script src="games.js"></script>
  <script>
    (function () {
      var grid = document.getElementById('grid');
      var list = window.GAMES || [];
      var slots = window.GAMES_SLOTS || 9;
      for (var i = 0; i < slots; i++) {
        var g = list[i];
        var el;
        if (g) {
          el = document.createElement('a');
          el.className = 'game';
          el.href = g.href;
          var img = document.createElement('div');
          img.className = 'game-img';
          var im = document.createElement('img');
          im.src = g.img;
          im.alt = g.title;
          im.loading = i < 3 ? 'eager' : 'lazy';
          img.appendChild(im);
          var body = document.createElement('div');
          body.className = 'game-body';
          var h = document.createElement('h3'); h.textContent = g.title;
          var p = document.createElement('p'); p.textContent = g.desc;
          var age = document.createElement('span'); age.className = 'age'; age.textContent = g.age || '';
          var play = document.createElement('span'); play.className = 'play'; play.textContent = 'Играть';
          body.appendChild(h); body.appendChild(p);
          if (g.age) body.appendChild(age);
          body.appendChild(play);
          el.appendChild(img); el.appendChild(body);
        } else {
          el = document.createElement('div');
          el.className = 'game soon';
          el.setAttribute('aria-label', 'Скоро новая игра');
          el.innerHTML = '<div><div class="num">' + (i + 1) + '</div><div class="txt">Скоро новая игра</div></div>';
        }
        grid.appendChild(el);
      }

      // Как на главной: шапка прячется при прокрутке вниз
      var header = document.getElementById('header');
      var last = 0;
      window.addEventListener('scroll', function () {
        var cur = window.pageYOffset || document.documentElement.scrollTop;
        header.style.transform = (cur > last && cur > 50) ? 'translateY(-100%)' : 'translateY(0)';
        last = cur <= 0 ? 0 : cur;
      });
    })();
  </script>
</body>
</html>
