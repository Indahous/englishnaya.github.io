<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0b">
<title>Сейф Круэллы</title>
<script>
  // /hb/cipher без слэша на конце → /hb/cipher/, иначе не найдётся secret.bin
  (function () {
    var p = location.pathname;
    if (!/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) location.replace(p + '/' + location.search + location.hash);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0b0b; --paper: #f6f2ec; --red: #e0102b; --grey: #1b1b1b; --line: #3a3a3a;
    --display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); font-family: var(--body); overscroll-behavior: none; }
  body { overflow-x: hidden; user-select: none; -webkit-user-select: none; }
  #spots { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #spots i { position: absolute; background: var(--grey); border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%; }
  main { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: max(22px, env(safe-area-inset-top)) 18px max(26px, env(safe-area-inset-bottom)); text-align: center; }
  .kicker { margin: 0; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--red); font-weight: 700; }
  h1 { margin: 0; font: 900 clamp(34px, 10vw, 50px)/1.05 var(--display); }
  h1 em { color: var(--red); }
  .sub { margin: 0; color: #b9b4ab; font-size: 15px; font-weight: 500; }

  #slots { display: flex; gap: 12px; margin: 6px 0 0; }
  .slot { width: 62px; height: 78px; border-radius: 14px; border: 2px solid var(--line); background: #141414; display: flex; align-items: center; justify-content: center;
    font: 900 40px var(--display); color: var(--paper); transition: border-color .2s, background .2s, transform .2s; }
  .slot.cur { border-color: var(--red); box-shadow: 0 0 0 4px rgba(224, 16, 43, .18); }
  .slot.filled { border-color: var(--paper); transform: translateY(-2px); }
  #slots.bad .slot { border-color: var(--red); background: #2a0a10; color: var(--red); }
  #slots.bad { animation: shake .5s; }
  #slots.ok .slot { border-color: #fff; background: var(--red); color: #fff; }
  @keyframes shake { 10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(5px); } 30%,50%,70% { transform: translateX(-9px); } 40%,60% { transform: translateX(9px); } }

  #msg { min-height: 44px; margin: 0; max-width: 320px; font-size: 15px; line-height: 1.35; color: #f3b5be; font-weight: 500; }
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(300px, 82vw); transition: opacity .5s, transform .5s; }
  #pad button { aspect-ratio: 1 / .86; border-radius: 18px; border: 1.5px solid var(--line); background: #171717; color: var(--paper);
    font: 700 30px var(--display); cursor: pointer; transition: transform .08s, background .12s, border-color .12s; }
  #pad button:active { transform: scale(.92); background: var(--red); border-color: var(--red); }
  #pad button.fn { font-size: 22px; color: #b9b4ab; }
  #pad button:disabled { opacity: .45; }

  /* открывшаяся картинка */
  #reveal { display: none; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  #reveal.on { display: flex; animation: rise .8s ease both; }
  #reveal .frame { background: #fff; padding: 10px; border-radius: 12px; box-shadow: 0 0 0 3px var(--red), 0 24px 60px rgba(0, 0, 0, .7); max-width: 94vw; }
  #reveal img { display: block; max-width: calc(94vw - 20px); max-height: 74vh; border-radius: 5px; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
  #confetti { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
</style>
</head>
<body>
<div id="spots" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <div id="lock">
    <p class="kicker">Сейф Круэллы</p>
    <h1 style="margin-top:10px">Введи <em>шифр</em></h1>
    <p class="sub" style="margin-top:10px">Четыре цифры, которые ты собрала</p>
  </div>
  <div id="slots" aria-live="polite"></div>
  <p id="msg"></p>
  <div id="pad"></div>

  <section id="reveal">
    <p class="kicker">Шифр взломан</p>
    <div class="frame"><img id="pic" alt=""></div>
  </section>
</main>

<script>
const LEN = 4;
const $ = id => document.getElementById(id);
let code = '', busy = false, tries = 0, blobP = null;

/* пятна на фоне */
(function () {
  const box = $('spots');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('i'), size = 50 + Math.random() * 130;
    s.style.cssText = `width:${size}px;height:${size * (.75 + Math.random() * .5)}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;transform:rotate(${Math.random() * 360}deg);opacity:${.5 + Math.random() * .5}`;
    box.appendChild(s);
  }
})();

/* ячейки и клавиатура */
const slotsEl = $('slots');
for (let i = 0; i < LEN; i++) { const d = document.createElement('div'); d.className = 'slot'; slotsEl.appendChild(d); }
function render() {
  [...slotsEl.children].forEach((s, i) => {
    s.textContent = code[i] || '';
    s.classList.toggle('filled', i < code.length);
    s.classList.toggle('cur', i === code.length && !busy);
  });
}
const pad = $('pad');
['1','2','3','4','5','6','7','8','9','⌫','0','✕'].forEach(k => {
  const b = document.createElement('button'); b.textContent = k; b.type = 'button';
  if (k === '⌫' || k === '✕') b.classList.add('fn');
  b.addEventListener('click', () => key(k));
  pad.appendChild(b);
});
addEventListener('keydown', e => {
  if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('⌫'); else if (e.key === 'Escape') key('✕');
});
function key(k) {
  if (busy) return;
  $('msg').textContent = '';
  if (k === '⌫') code = code.slice(0, -1);
  else if (k === '✕') code = '';
  else if (code.length < LEN) code += k;
  render();
  if (code.length === LEN) open();
}

/* зашифрованная картинка: salt(16) + iv(12) + шифртекст; ключ получается из цифр */
blobP = fetch('secret.bin', { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); }).then(b => new Uint8Array(b));
async function decrypt(pin) {
  const buf = await blobP;
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: buf.slice(0, 16), iterations: 150000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28)));
  const nl = pt.indexOf(10);
  return URL.createObjectURL(new Blob([pt.slice(nl + 1)], { type: new TextDecoder().decode(pt.slice(0, nl)) }));
}

async function open() {
  busy = true; render();
  if (!(window.crypto && crypto.subtle)) { fail('Открой страницу по защищённой ссылке (https://).', true); return; }
  let url;
  try { url = await decrypt(code); }
  catch (e) {
    const loaded = await blobP.then(() => true, () => false);
    if (!loaded) return fail('Сейф не загрузился. Проверь интернет и обнови страницу.', true);
    return wrong();
  }
  success(url);
}
function wrong() {
  tries++;
  slotsEl.classList.add('bad');
  $('msg').textContent = tries >= 2 ? 'Круэллу не обманешь! Подсказка: вводи цифры в том порядке, в каком ты их находила.' : 'Круэллу не обманешь! Проверь цифры.';
  if (navigator.vibrate) navigator.vibrate(180);
  setTimeout(() => { slotsEl.classList.remove('bad'); code = ''; busy = false; render(); }, 900);
}
function fail(text, keepBusy) { $('msg').textContent = text; code = ''; busy = !!keepBusy; if (!keepBusy) render(); }

function success(url) {
  slotsEl.classList.add('ok');
  if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
  const pic = $('pic');
  pic.onload = () => {
    setTimeout(() => {
      $('lock').style.display = 'none'; slotsEl.style.display = 'none'; $('msg').style.display = 'none'; $('pad').style.display = 'none';
      $('reveal').classList.add('on'); confetti();
    }, 650);
  };
  pic.src = url;
}

/* красно-бело-чёрное конфетти */
function confetti() {
  const cv = $('confetti'), ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = ['#e0102b', '#ffffff', '#f6f2ec', '#e0102b', '#2a2a2a'];
  const bits = Array.from({ length: 150 }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
    vy: 2.4 + Math.random() * 3.6, vx: -1.5 + Math.random() * 3, rot: Math.random() * 6.28, vr: -.15 + Math.random() * .3, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  (function f(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.rot += b.vr; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore(); });
    if (t - t0 < 4500) requestAnimationFrame(f); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}
render();
</script>
</body>
</html>
